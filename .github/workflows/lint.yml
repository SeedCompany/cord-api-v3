name: Lint
on:
  pull_request:
  push:
    branches:
      - master
      - develop


# One active run per branch/PR — a force-push cancels the now-stale run
# instead of letting it occupy runners for its full duration. Guarded to
# pull_request so develop/master push runs always complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      # Type-aware rules and `tsc` itself both build a full TypeScript program
      # in memory, and that's grown enough (dozens of new domains from the
      # Postgres migration) to hit Node's default ~4GB heap ceiling on
      # ubuntu-latest runners — an OOM crash mid-step, not a real problem with
      # the code. Runners have far more RAM than that default; just raise the
      # ceiling for every step in this job, not only whichever one crashed
      # most recently.
      NODE_OPTIONS: '--max-old-space-size=8192'

    steps:
      - uses: actions/checkout@v4
      - name: Node Setup & Yarn Install
        uses: ./.github/actions/setup

      - name: Gel Setup
        uses: ./.github/actions/gel-setup
        with:
          # Only the generated TS client is needed to type-check & lint —
          # proven by generating the schema against an unreachable DSN.
          server: 'false'

      - name: Check for no duplicate dependencies
        run: yarn dedupe --check

      - name: Generate GQL Schema
        run: yarn start -- --gen-schema && yarn gql-tada generate output

      - name: Check TypeScript
        run: yarn type-check

      - name: Upload GQL Schema
        uses: actions/upload-artifact@v4
        with:
          name: schema.graphql
          path: schema.graphql

      - name: Lint
        run: yarn eslint --ext .ts,.tsx --max-warnings 0 .
