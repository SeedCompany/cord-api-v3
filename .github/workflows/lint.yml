name: Lint
on:
  pull_request:
  push:
    branches:
      - master
      - develop


# One active run per branch/PR — a force-push cancels the now-stale run
# instead of letting it occupy runners for its full duration. Guarded to
# pull_request so develop/master push runs always complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Node Setup & Yarn Install
        uses: ./.github/actions/setup

      - name: Gel Setup
        uses: ./.github/actions/gel-setup

      - name: Check for no duplicate dependencies
        run: yarn dedupe --check

      - name: Generate GQL Schema
        run: yarn start -- --gen-schema && yarn gql-tada generate output

      - name: Check TypeScript
        run: yarn type-check

      - name: Upload GQL Schema
        uses: actions/upload-artifact@v4
        with:
          name: schema.graphql
          path: schema.graphql

      - name: Lint
        run: yarn eslint --ext .ts,.tsx --max-warnings 0 .
