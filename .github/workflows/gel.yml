name: Gel
on:
  pull_request:


# One active run per branch/PR — a force-push cancels the now-stale run
# instead of letting it occupy runners for its full duration. Guarded to
# pull_request so develop/master push runs always complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  Clean:
    runs-on: ubuntu-latest
    # These steps boot the app with no Postgres service present. DATABASE now
    # defaults to postgres, which requires POSTGRES_URL at startup, so pin the
    # engine this workflow always ran under.
    # migration-todo: delete this workflow with the Gel engine code.
    env:
      DATABASE: neo4j
    steps:
      - uses: actions/checkout@v4
      - name: Node Setup & Yarn Install
        uses: ./.github/actions/setup

      - name: Gel Setup
        uses: ./.github/actions/gel-setup
        with:
          # The only workflow that runs anything against Gel itself — the
          # seed below — so this is the one caller that needs the cached dump
          # loaded into the instance.
          restore-database: 'true'

      - name: Validate seed scripts are error free
        run: yarn gel:seed
        shell: bash
