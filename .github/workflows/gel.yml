name: Gel
on:
  pull_request:


# One active run per branch/PR — a force-push cancels the now-stale run
# instead of letting it occupy runners for its full duration. Guarded to
# pull_request so develop/master push runs always complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  Clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Node Setup & Yarn Install
        uses: ./.github/actions/setup

      - name: Gel Setup
        uses: ./.github/actions/gel-setup

      - name: Inject Access Policies
        run: yarn console gel ap inject

      - name: Schema Migrations In Sync
        run: gel migration status
        if: github.event.pull_request.draft == false

      - name: Validate seed scripts are error free
        run: yarn gel:seed
        shell: bash
