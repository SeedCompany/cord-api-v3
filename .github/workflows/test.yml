name: Test
on:
  pull_request:
  push:
    branches:
      - master
      - develop

# Jobs only check out code and run tests; the github-actions Jest reporter
# annotates via stdout workflow commands, which need no write scopes.
permissions:
  contents: read

# One active run per branch/PR — a force-push cancels the now-stale run
# instead of letting it occupy runners for its full duration. Guarded to
# pull_request so develop/master push runs always complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  Unit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Node Setup & Yarn Install
        uses: ./.github/actions/setup

      - name: Gel Setup
        uses: ./.github/actions/gel-setup
        with:
          # Unit tests never open a Gel connection (this job has no Neo4j
          # service either); only the generated TS client is needed.
          server: 'false'

      - name: Generate GQL Schema
        run: yarn start -- --gen-schema && yarn gql-tada generate output

      - name: Tests
        run: yarn test --reporters=github-actions

  E2E:
    name: E2E Tests (${{ matrix.database }} ${{ matrix.shard }}/${{ matrix.total || 6 }})
    runs-on: ubuntu-latest

    services:
      neo4j:
        image: neo4j:2025.04-enterprise
        ports:
          - 7687:7687
        env:
          NEO4J_ACCEPT_LICENSE_AGREEMENT: yes
          NEO4J_PLUGINS: '["apoc"]'
          NEO4J_dbms_security_auth__enabled: 'false'
          NEO4J_dbms_security_procedures_unrestricted: apoc.*
          NEO4J_dbms_connector_bolt_enabled: 'true'
          NEO4J_dbms_connector_bolt_advertised__address: localhost:7687
        options: >-
          --health-cmd "cypher-shell 'match (n) return count(n)'"
          --health-timeout 10s
          --health-retries 20
          --health-interval 10s
          --health-start-period 30s
      # Needed for the postgres matrix entries; idle for the neo4j ones.
      postgres:
        # Alpine, deliberately, because it is what matches Neo4j.
        #
        # Name columns do not care which image this is — they name the
        # `display_order` collation explicitly (migration 0032), so they order
        # identically anywhere. Every OTHER text sort falls back to the collation
        # the database was created with, and ephemeral test databases are created
        # with no LOCALE clause, so they inherit initdb's choice — which behaves
        # differently per C library. musl has no locale-aware comparison and so
        # compares raw bytes; glibc case-folds and ignores a leading space.
        #
        # Neo4j orders those columns by raw code points, and UTF-8 byte order IS
        # code-point order, so musl reproduces Neo4j and glibc would diverge from
        # it. Parity is the rule for this migration, so CI runs the family that
        # has it. The columns concerned are two address fields, a post body, two
        # product descriptions, an ISO code, a PMC entity code, a department id
        # and an unavailability description (see NAME_COLUMNS in
        # src/core/drizzle/order-by.ts for the collated set).
        #
        # migration-todo: emitting `collate "C"` for non-name text sorts would
        # remove the dependence on the image entirely and match Neo4j anywhere,
        # including on a glibc production server. Not done — it changes ordering
        # on glibc, so it is a deliberate call, not a cleanup.
        image: postgres:16-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: cord
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    strategy:
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
        database:
          - neo4j
#          - gel
        include:
          # Postgres runs the WHOLE suite. It used to run an opt-in allowlist of
          # migrated domains, which is removed deliberately: an allowlist
          # silently excludes anything nobody remembered to name, and it failed
          # that way three separate times — a domain whose own migration PR
          # never added it, a name that didn't match because entries are
          # anchored to a following `.` (so `periodic-report` never covered
          # `periodic-report-narrative-file`), and every spec under `test/`
          # subdirectories, which the pattern's shape could never match at all.
          # The last of those hid the fact that webhooks was never ported.
          #
          # Suites that genuinely cannot pass under Postgres now switch
          # themselves off inside the test file (`describe.skip` on a DATABASE
          # check), so they are reported as skipped, appear in the run output,
          # and state their reason — instead of being invisible. Currently: the
          # three *-changeset-aware specs (changesets are not being carried
          # forward). Add that condition to the test file — never a filter
          # here. (Webhooks used to be listed here too — ported 2026-08-05,
          # its spec now runs unconditionally on both engines.)
          #
          # Single shard on purpose: the full suite is ~10 min serial, and six
          # jobs each paying the full setup cost was pure runner waste. Bump
          # `total` (and add shard entries) if that grows uncomfortable.
          - database: postgres
            shard: 1
            total: 1
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - name: Node Setup & Yarn Install
        uses: ./.github/actions/setup

      - name: Gel Setup
        uses: ./.github/actions/gel-setup
        with:
          # Only the gel matrix entry runs tests against Gel; on neo4j and
          # postgres, ephemeralGel() is a no-op (test/setup/gel-setup.ts) and
          # nothing connects — proven by full suites passing on both engines
          # with GEL_DSN pointed at an unreachable port. The generated TS
          # client (cached) is all those entries need.
          server: ${{ matrix.database == 'gel' }}

      - name: Generate GQL Schema
        run: yarn start -- --gen-schema && yarn gql-tada generate output

      - name: E2E Tests
        # --maxWorkers=1: the per-file Neo4j wipe requires spec files to run
        # sequentially — the shard's Neo4j container is shared, so a wipe at
        # one file's end would destroy a concurrently-running file's data.
        # Runner core-counts already made this effectively serial; pin it so a
        # beefier runner can't silently reintroduce the race.
        # --workerIdleMemoryLimit: with one worker, EVERY spec file's app runs
        # in the same long-lived process — teardown leaks accumulate and blow
        # V8's default 4GB heap cap late in the shard (all-shards OOM,
        # 2026-07-14). Recycling the worker between files when it bloats keeps
        # serial semantics with bounded memory.
        run: yarn test:e2e --maxWorkers=1 --workerIdleMemoryLimit=1500MB --shard=${{ matrix.shard }}/${{ matrix.total || 6 }} --reporters=github-actions
        env:
          NEO4J_VERSION: ${{ matrix.neo4j-version }}
          DATABASE: ${{ matrix.database }}
          POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/cord
          # Opt-in for the between-spec-file Neo4j wipe (test/setup/neo4j-wipe.ts).
          # The wipe additionally refuses any non-loopback NEO4J_URL. Only set
          # this where Neo4j is an ephemeral per-job service container.
          NEO4J_TEST_WIPE: true
        # neo4j is the production engine → blocking (required to merge).
        # postgres is dev-only until the cutover, so keep it running for
        # migration signal but DON'T gate merges on it — a PG failure on a
        # migrated domain shouldn't block an unrelated PR. (gel is likewise
        # advisory.) migration-todo: flip postgres back to a required gate
        # (narrow this to `== 'gel'`) once the migration is further along /
        # approaching cutover.
        continue-on-error: ${{ matrix.database != 'neo4j' }}
