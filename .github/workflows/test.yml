name: Test
on:
  pull_request:
  push:
    branches:
      - master
      - develop

# Jobs only check out code and run tests; the github-actions Jest reporter
# annotates via stdout workflow commands, which need no write scopes.
permissions:
  contents: read

# One active run per branch/PR — a force-push cancels the now-stale run
# instead of letting it occupy runners for its full duration. Guarded to
# pull_request so develop/master push runs always complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  Unit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Node Setup & Yarn Install
        uses: ./.github/actions/setup

      - name: Gel Setup
        uses: ./.github/actions/gel-setup

      - name: Generate GQL Schema
        run: yarn start -- --gen-schema && yarn gql-tada generate output

      - name: Tests
        run: yarn test --reporters=github-actions

  E2E:
    name: E2E Tests (${{ matrix.database }} ${{ matrix.shard }}/${{ matrix.total || 6 }})
    runs-on: ubuntu-latest

    services:
      neo4j:
        image: neo4j:2025.04-enterprise
        ports:
          - 7687:7687
        env:
          NEO4J_ACCEPT_LICENSE_AGREEMENT: yes
          NEO4J_PLUGINS: '["apoc"]'
          NEO4J_dbms_security_auth__enabled: 'false'
          NEO4J_dbms_security_procedures_unrestricted: apoc.*
          NEO4J_dbms_connector_bolt_enabled: 'true'
          NEO4J_dbms_connector_bolt_advertised__address: localhost:7687
        options: >-
          --health-cmd "cypher-shell 'match (n) return count(n)'"
          --health-timeout 10s
          --health-retries 20
          --health-interval 10s
          --health-start-period 30s
      # Needed for the postgres matrix entries; idle for the neo4j ones.
      postgres:
        # Alpine. The image's C library no longer affects any list ordering:
        # every text sort names the ICU `display_order` collation explicitly
        # (migration 0032, applied by displayOrder() in
        # src/core/drizzle/order-by.ts — decided 2026-09-15, sorting is
        # case-insensitive everywhere), and ICU orders identically on musl
        # (here) and glibc (production RDS). So what these jobs assert about
        # ordering is what production does, even though ephemeral test
        # databases inherit initdb's default collation.
        image: postgres:16-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: cord
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    strategy:
      matrix:
        include:
          # ─── Postgres: the engine production runs. Whole suite, one shard. ──
          # It used to run an opt-in allowlist of migrated domains, which is
          # removed deliberately: an allowlist silently excludes anything nobody
          # remembered to name, and it failed that way three separate times — a
          # domain whose own migration PR never added it, a name that didn't
          # match because entries are anchored to a following `.` (so
          # `periodic-report` never covered `periodic-report-narrative-file`),
          # and every spec under `test/` subdirectories, which the pattern's
          # shape could never match at all. The last of those hid the fact that
          # webhooks was never ported.
          #
          # Suites that genuinely cannot pass under Postgres switch themselves
          # off inside the test file (`describe.skip` on a DATABASE check), so
          # they are reported as skipped, appear in the run output, and state
          # their reason — instead of being invisible. Currently: the three
          # *-changeset-aware specs (changesets are not being carried forward).
          # Add that condition to the test file — never a filter here.
          # (Webhooks used to be listed here too — ported 2026-08-05, its spec
          # now runs unconditionally on both engines.)
          #
          # Single shard on purpose: the full suite is ~10 min serial, and six
          # jobs each paying the full setup cost was pure runner waste. Bump
          # `total` (and add shard entries) if that grows uncomfortable.
          - database: postgres
            shard: 1
            total: 1

          # ─── Neo4j: dead code, kept as a ONE-shard canary until Phase 7. ────
          # Production moved to Postgres ~2026-09-18, so these repositories are
          # awaiting deletion (#3890) and nothing here guards a live code path.
          # It earns one shard because the Neo4j path is still the only way to
          # answer "did this work before the cutover?" — write the failing case
          # as an e2e spec and run it on both engines. `yarn type-check` already
          # catches compile-level rot in that path; this catches the runtime
          # kind, which nothing else would.
          #
          # Cut from six shards to one on 2026-09-23: the six cost ~133 of the
          # run's ~167 runner-minutes to exercise code we are deleting. Shard
          # 1/6 is a fixed sixth of the suite (Jest splits deterministically by
          # file path), so this is a smoke check, NOT coverage — do not read a
          # green canary as "Neo4j still passes". Delete this entry along with
          # the repositories in #3890, and drop the `neo4j` service above with
          # it. (`gel` was commented out of this matrix long before the cutover.)
          - database: neo4j
            shard: 1
            total: 6
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - name: Node Setup & Yarn Install
        uses: ./.github/actions/setup

      - name: Gel Setup
        uses: ./.github/actions/gel-setup

      - name: Generate GQL Schema
        run: yarn start -- --gen-schema && yarn gql-tada generate output

      - name: E2E Tests
        # --maxWorkers=1: the per-file Neo4j wipe requires spec files to run
        # sequentially — the shard's Neo4j container is shared, so a wipe at
        # one file's end would destroy a concurrently-running file's data.
        # Runner core-counts already made this effectively serial; pin it so a
        # beefier runner can't silently reintroduce the race.
        # --workerIdleMemoryLimit: with one worker, EVERY spec file's app runs
        # in the same long-lived process — teardown leaks accumulate and blow
        # V8's default 4GB heap cap late in the shard (all-shards OOM,
        # 2026-07-14). Recycling the worker between files when it bloats keeps
        # serial semantics with bounded memory.
        # `default` alongside `github-actions`: the github-actions reporter emits
        # ONLY inline annotations, so the log carries no run summary and no
        # error `cause`. A failure on 2026-09-23 reported ten annotations all
        # reading `Failed query: select to_regclass(...)` with the underlying
        # driver error nowhere in the log or the API — leaving a red required
        # check that could not be diagnosed from its own artifacts. A required
        # check has to explain itself when it fails.
        run: yarn test:e2e --maxWorkers=1 --workerIdleMemoryLimit=1500MB --shard=${{ matrix.shard }}/${{ matrix.total || 6 }} --reporters=default --reporters=github-actions
        env:
          NEO4J_VERSION: ${{ matrix.neo4j-version }}
          DATABASE: ${{ matrix.database }}
          POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/cord
          # Opt-in for the between-spec-file Neo4j wipe (test/setup/neo4j-wipe.ts).
          # The wipe additionally refuses any non-loopback NEO4J_URL. Only set
          # this where Neo4j is an ephemeral per-job service container.
          NEO4J_TEST_WIPE: true
        # There is deliberately NO `continue-on-error` here: every job reports
        # its real result, and BRANCH PROTECTION alone decides which results
        # block a merge (Settings → Branches → develop → required status
        # checks). Keeping both mechanisms in play is what made the old
        # behavior so hard to see.
        #
        # What used to be here: `continue-on-error: ${{ matrix.database !=
        # 'neo4j' }}`. Because it sat at STEP level, a Postgres failure was
        # swallowed and the job still reported green — so Postgres could not go
        # red even in principle, and the required checks were the six Neo4j
        # shards. Correct before the cutover; backwards after it, and that is
        # how a class of global-search regressions reached users unnoticed.
        #
        # ⚠ Required contexts must now list `E2E Tests (postgres 1/1)` and must
        # NOT list any neo4j shard: a required context whose job no longer
        # exists leaves every PR waiting forever on a status that will never be
        # reported. The neo4j canary above is intentionally NOT required — it
        # reports red honestly when it breaks, and blocks nothing.
