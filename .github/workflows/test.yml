name: Test
on:
  pull_request:
  push:
    branches:
      - master
      - develop

# Jobs only check out code and run tests; the github-actions Jest reporter
# annotates via stdout workflow commands, which need no write scopes.
permissions:
  contents: read

# One active run per branch/PR — a force-push cancels the now-stale run
# instead of letting it occupy runners for its full duration. Guarded to
# pull_request so develop/master push runs always complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  Unit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Node Setup & Yarn Install
        uses: ./.github/actions/setup

      - name: Generate GQL Schema
        run: yarn start -- --gen-schema && yarn gql-tada generate output

      - name: Tests
        run: yarn test --reporters=github-actions

  E2E:
    name: E2E Tests (${{ matrix.database }} ${{ matrix.shard }}/${{ matrix.total || 6 }})
    runs-on: ubuntu-latest

    # No service containers. Postgres is started by the step below, because it
    # needs a certificate generated from a file in this repository and services
    # start before the checkout that would provide it. Neo4j is gone: nothing
    # here runs against it any more (#3890).

    strategy:
      matrix:
        include:
          # ─── Postgres: the engine production runs. Whole suite, one shard. ──
          # It used to run an opt-in allowlist of migrated domains, which is
          # removed deliberately: an allowlist silently excludes anything nobody
          # remembered to name, and it failed that way three separate times — a
          # domain whose own migration PR never added it, a name that didn't
          # match because entries are anchored to a following `.` (so
          # `periodic-report` never covered `periodic-report-narrative-file`),
          # and every spec under `test/` subdirectories, which the pattern's
          # shape could never match at all. The last of those hid the fact that
          # webhooks was never ported.
          #
          # Suites that genuinely cannot pass under Postgres switch themselves
          # off inside the test file (`describe.skip` on a DATABASE check), so
          # they are reported as skipped, appear in the run output, and state
          # their reason — instead of being invisible. Currently: the three
          # *-changeset-aware specs (changesets are not being carried forward).
          # Add that condition to the test file — never a filter here.
          #
          # Single shard on purpose: the full suite is ~10 min serial, and six
          # jobs each paying the full setup cost was pure runner waste. Bump
          # `total` (and add shard entries) if that grows uncomfortable.
          #
          # ⚠ This is a one-entry matrix on purpose. The job's NAME is a
          # required status check, so it must keep reading exactly
          # `E2E Tests (postgres 1/1)`. Renaming it — including by dropping the
          # matrix and hardcoding a different string — leaves every open PR
          # waiting forever on a context that will never be reported.
          - database: postgres
            shard: 1
            total: 1
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      # The app's Postgres client ALWAYS performs an SSL handshake — see
      # src/core/drizzle/drizzle.service.ts, where `sslmode=no-verify` only
      # skips certificate verification and there is no way to turn SSL off. So
      # the server has to present a certificate, exactly as the local compose
      # setup does. Without one EVERY spec dies on the migrator's first query
      # with `The server does not support SSL connections` — which is what had
      # been happening here unnoticed, because this step was advisory and the
      # reporter printed no test output to contradict it.
      #
      # This cannot be a service container: the certificate is generated by
      # `docker/postgres-ssl-init.sh` from this repository, and services start
      # before the checkout that would provide it.
      #
      # `postgres:16` (Debian), not alpine: it matches production RDS 16.15 and
      # ships the openssl CLI the init script needs. Ordering does not depend on
      # the choice — every text sort names the ICU `display_order` collation
      # explicitly (displayOrder() in src/core/drizzle/order-by.ts).
      - name: Start Postgres with SSL
        run: |
          set -euo pipefail
          docker run -d --name postgres \
            -e POSTGRES_DB=cord \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -p 5432:5432 \
            -v "$PWD/docker/postgres-ssl-init.sh:/docker-entrypoint-initdb.d/postgres-ssl-init.sh:ro" \
            postgres:16
          # Wait for `ssl = on` over TCP, not for readiness over the socket.
          # The entrypoint runs init scripts against a TEMPORARY socket-only
          # server and only then restarts the real one, so a socket probe can
          # answer while the certificate does not exist yet — measured: ready
          # at 1.0s with `show ssl` still `off`. Waiting on the condition the
          # tests actually depend on cannot race, because the temporary server
          # reports `off` and only the final one reports `on`. TCP for the same
          # reason, and it is the path the tests use; PGPASSWORD because host
          # connections authenticate where socket connections do not.
          for _ in $(seq 1 60); do
            if [ "$(docker exec -e PGPASSWORD=postgres postgres \
                     psql -h 127.0.0.1 -U postgres -tAc 'show ssl' 2>/dev/null \
                   | tr -d '[:space:]')" = on ]; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "${ready:-}" != 1 ]; then
            echo "::error::Postgres never came up with ssl=on; every spec would fail with 'The server does not support SSL connections'" >&2
            docker logs postgres >&2 || true
            exit 1
          fi
          docker exec postgres pg_isready -h 127.0.0.1 -U postgres

      - name: Node Setup & Yarn Install
        uses: ./.github/actions/setup

      - name: Generate GQL Schema
        run: yarn start -- --gen-schema && yarn gql-tada generate output

      - name: E2E Tests
        # --maxWorkers=1: each spec file builds its own connection pool, so
        # parallel workers multiply connections against one server — and the
        # runner's core count would otherwise decide how many. Serial keeps
        # that bounded and predictable. (It was originally pinned for the
        # per-file Neo4j wipe, which shared one container across a shard; that
        # reason is gone with Neo4j, this one is not.)
        # --workerIdleMemoryLimit: with one worker, EVERY spec file's app runs
        # in the same long-lived process — teardown leaks accumulate and blow
        # V8's default 4GB heap cap late in the shard (all-shards OOM,
        # 2026-07-14). Recycling the worker between files when it bloats keeps
        # serial semantics with bounded memory.
        # `default` alongside `github-actions`: the github-actions reporter emits
        # ONLY inline annotations, so the log carries no run summary and no
        # error `cause`. A failure on 2026-09-23 reported ten annotations all
        # reading `Failed query: select to_regclass(...)` with the underlying
        # driver error nowhere in the log or the API — leaving a red required
        # check that could not be diagnosed from its own artifacts. A required
        # check has to explain itself when it fails.
        run: yarn test:e2e --maxWorkers=1 --workerIdleMemoryLimit=1500MB --shard=${{ matrix.shard }}/${{ matrix.total || 6 }} --reporters=default --reporters=github-actions
        env:
          DATABASE: ${{ matrix.database }}
          # `sslmode=no-verify` is required, not incidental: the certificate
          # generated above is self-signed, and without this the client
          # verifies it against the bundled Amazon RDS roots and rejects it.
          # It does NOT disable SSL — the handshake still happens.
          POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/cord?sslmode=no-verify
        # There is deliberately NO `continue-on-error` here: every job reports
        # its real result, and BRANCH PROTECTION alone decides which results
        # block a merge (Settings → Branches → develop → required status
        # checks). Keeping both mechanisms in play is what made the old
        # behavior so hard to see.
        #
        # What used to be here: `continue-on-error: ${{ matrix.database !=
        # 'neo4j' }}`. Because it sat at STEP level, a Postgres failure was
        # swallowed and the job still reported green — so Postgres could not go
        # red even in principle, and the required checks were the six Neo4j
        # shards. Correct before the cutover; backwards after it, and that is
        # how a class of global-search regressions reached users unnoticed.
        #
        # ⚠ Required contexts must list `E2E Tests (postgres 1/1)` and must NOT
        # list any neo4j shard: a required context whose job no longer exists
        # leaves every PR waiting forever on a status that will never be
        # reported. That is why `E2E Tests (neo4j 1/6)` has to come OUT of the
        # required list before this change lands, not after.
