name: Setup Gel
description: 'Setup Gel server, migrate schema, generate TS files'
inputs:
  restore-database:
    description: >-
      Load the cached dump into the Gel instance, so the instance actually holds
      the migrated schema. Only a job that RUNS something against Gel needs it
      (`gel migration status`, `yarn gel:seed`, an e2e shard with
      DATABASE=gel). Jobs that merely compile or boot the app do not: the
      generated TypeScript client comes from the cache restore below, not from
      the database. Off by default because the restore is the most expensive
      thing in the job — see the comment on that step.
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    # The CLI's built-in package root is still `packages.edgedb.com`, the
    # pre-rename domain. It has been retired and now fails its TLS handshake, so
    # every `gel` command that resolves a version dies there — including
    # `project init` below, which looks up the server pinned in gel.toml. That
    # kills Gel Setup, and because it runs before everything else, it takes
    # lint, type-check, unit and e2e down with it in every workflow.
    #
    # `setup-gel` already downloads from packages.geldata.com, but it runs the
    # CLI with a hardcoded environment and never passes that on, so the CLI
    # falls back to its own default. Exporting it here reaches every later step
    # in the job. Both names are set because the CLI accepts either and which
    # one it reads depends on its version.
    #
    # Upstream added a `package-root` input on 2026-09-13 that exports these
    # itself; drop this step once the action ships a release carrying it.
    - name: Point the Gel CLI at the current package root
      shell: bash
      run: |
        echo "GEL_PKG_ROOT=https://packages.geldata.com" >> "$GITHUB_ENV"
        echo "EDGEDB_PKG_ROOT=https://packages.geldata.com" >> "$GITHUB_ENV"

    - name: Install Gel CLI
      uses: geldata/setup-gel@v1
      with:
        server-version: none

    - name: Initialize Gel Project
      shell: bash
      run: gel project init --no-migrations --non-interactive

    # The migrated (empty) database and the generated TS client are pure
    # functions of dbschema/ + the generator deps, but rebuilding them takes
    # ~15-20 min per job. Cache a dump of the migrated DB + the generated
    # files; on a hit, the restored files skip `gel migrate` and `yarn gel:gen`
    # entirely.
    #
    # ⚠ The generated client lands here, from THIS cache — `src/core/gel/
    # generated-client` is gitignored and imported by ~10 source files, so
    # without it nothing in the repo compiles. That is why this action cannot
    # simply be dropped while any Gel code remains.
    - name: Restore migrated-DB dump & generated client
      id: gel-cache
      uses: actions/cache@v4
      with:
        path: |
          .gel-cache
          src/core/gel/generated-client
          src/core/gel/schema.ts
          src/**/*.edgeql.ts
        key: gel-setup-${{ runner.os }}-${{ hashFiles('dbschema/**', 'gel.toml', 'yarn.lock') }}

    - name: Migrate Gel Schema
      if: steps.gel-cache.outputs.cache-hit != 'true'
      shell: bash
      run: gel migrate --single-transaction

    - name: Generate Gel TS files
      if: steps.gel-cache.outputs.cache-hit != 'true'
      shell: bash
      run: yarn gel:gen

    - name: Dump migrated DB for cache
      if: steps.gel-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p .gel-cache
        gel dump .gel-cache/main.dump

    # ⚠ MEASURED 2026-09-23: this takes **10.1 minutes**, for a dump the CLI
    # itself reports as 0.68 MB — it is by far the most expensive step in any
    # job that runs it, more than the test suite. It is not data volume and it
    # is not a cache miss (the cache hit; migrate and gel:gen were skipped).
    #
    # Unlike the cache above, this cannot be reused between jobs: it loads a
    # dump into a live server, and every job gets a fresh runner. So it is paid
    # per job, every run.
    #
    # It populates the DATABASE, which only a job that queries Gel needs. Every
    # job in test.yml runs DATABASE=postgres or neo4j (the `gel` matrix entry is
    # commented out), and lint/api-schema only boot the app for `--gen-schema`.
    # Verified locally with the Gel instance stopped: e2e, type-check, eslint
    # and `yarn start -- --gen-schema` all succeed. So it is skipped unless a
    # caller asks for it, which today is `gel.yml` alone.
    - name: Restore migrated DB from cache
      if: >-
        steps.gel-cache.outputs.cache-hit == 'true' &&
        inputs.restore-database == 'true'
      shell: bash
      run: gel restore .gel-cache/main.dump
