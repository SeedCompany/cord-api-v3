services:
  db:
    image: neo4j:2025.04-enterprise
    ports:
      - 7474:7474
      - 7687:7687
    networks:
      - cord
    environment:
      NEO4J_ACCEPT_LICENSE_AGREEMENT: 'yes'
      NEO4J_AUTH: neo4j/admin
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_metrics_enabled: 'false'
      NEO4J_dbms_security_auth__enabled: 'false'
      NEO4J_dbms_security_auth__minimum__password__length: 1

  postgres:
    # ⚠️ Match production's image FAMILY. This used to say alpine was fine
    # because every text sort named the `display_order` collation explicitly —
    # true when written, no longer true. That collation now applies to NAME
    # columns only (NAME_COLUMNS in src/core/drizzle/order-by.ts), because that is
    # the set Neo4j folds. Other text sorts fall back to the database default,
    # which behaves differently per C library: musl here orders by raw bytes,
    # glibc orders case-insensitively under the same collation name. So local
    # ordering of those columns will not match a glibc production image.
    image: postgres:16-alpine
    ports:
      - 5432:5432
    networks:
      - cord
    environment:
      POSTGRES_DB: cord
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./.pg.local:/var/lib/postgresql/data

networks:
  cord:
