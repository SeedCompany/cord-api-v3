services:
  postgres:
    # Major version 16 = production RDS (16.15, us-east-2), checked 2026-09-21.
    # Debian-based image, not alpine: it matches production RDS's glibc and
    # ships the openssl CLI that the first-boot SSL script needs. Text ordering
    # doesn't depend on this choice — every text sort names the ICU
    # `display_order` collation explicitly (displayOrder() in
    # src/core/drizzle/order-by.ts).
    image: postgres:16
    ports:
      - 5432:5432
    environment:
      POSTGRES_DB: cord
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./.pg.local:/var/lib/postgresql/data
      # Generates a self-signed cert on first boot. The API's PG client always
      # performs an SSL handshake (sslmode=no-verify only skips verification),
      # so even this local server has to present a certificate.
      - ./docker/postgres-ssl-init.sh:/docker-entrypoint-initdb.d/postgres-ssl-init.sh:ro
